# FORQO · Software Engineering
# Weekly dependency version checks; updates are proposed as pull requests for review.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    # Do not re-propose the known CPython 3.11 refcount regression.
    # A later release is still eligible and must pass the full Python matrix.
    ignore:
      - dependency-name: "pyside6-essentials"
        versions: ["6.12.0"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "FORQO deps"
      include: "scope"
    groups:
      forqo-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "FORQO deps"
      include: "scope"
    groups:
      forqo-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
