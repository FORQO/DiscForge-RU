name: Capture native Studio screenshots on macOS 26
on:
  push:
    branches: [release-capture/studio-1.5.2-mac26]
    paths: ['.github/workflows/capture-mac26.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python tools/capture_studio_release.py --language en --output build/gallery
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: build/gallery/*.jpg
          if-no-files-found: error
  collect:
    needs: capture
    runs-on: ubuntu-latest
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: docs/images/studio-1.5.2/macos
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: docs/images/studio-1.5.2/windows
          run-id: 44318404283
          github-token: ${{ github.token }}
      - name: Save native documentation images
        run: |
          set -eu
          test "$(find docs/images/studio-1.5.2/windows -name '*.jpg' | wc -l)" -eq 19
          test "$(find docs/images/studio-1.5.2/macos -name '*.jpg' | wc -l)" -eq 18
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/images/studio-1.5.2
          git commit -m 'Save English Studio screenshots from native Windows and Apple Silicon'
          git push origin HEAD:refs/heads/release-capture/studio-1.5.2-mac26
