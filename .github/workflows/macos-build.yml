name: macOS Apple Silicon build
on:
  push:
    branches: [main, feature/macos-disc-burning]
  pull_request:
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Prepare Python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Build and smoke test app
        run: bash build_app_macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: DiskForge-macOS-arm64
          path: |
            dist/DiskForge-*.zip
            build/macos-self-test.json
