name: Tests
on:
  workflow_call:
  workflow_dispatch:
jobs:
  unit:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: python -m pip install -r requirements.txt
      - name: Menu export pixel parity
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p test_menu_customization.py -v
      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m py_compile core.py settings.py main.py macos_burn.py cli.py
      - name: Preserve failed rendering diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rendering-diagnostics-${{ matrix.python-version }}
          path: build/test-artifacts/
          if-no-files-found: ignore
