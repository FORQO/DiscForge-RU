name: Windows Studio build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install packages
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Regression tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests -v
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --windowed --icon assets/brand/diskforge.ico --onedir --add-data "assets;assets" --add-data "tools/windows_iso.ps1;tools" --add-data "LICENSE;." --add-data "THIRD_PARTY_NOTICES.md;." --name DiscForge_RU main.py
      - uses: actions/cache@v6
        with:
          path: build/dependencies
          key: windows-tools-ffmpeg902-tsmuxer270-java8u504
      - name: Package tools and Java, self-test, archive
        env:
          PYTHONUTF8: '1'
        run: python tools/package_windows.py --app dist/DiscForge_RU --output release
      - uses: actions/upload-artifact@v7
        with:
          name: DiscForge-RU-Windows-x64
          path: release/
