name: Windows app and release
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Regression tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests -v
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --windowed --icon assets/brand/diskforge.ico --onedir --add-data "assets;assets" --add-data "tools/windows_iso.ps1;tools" --add-data "LICENSE;." --add-data "THIRD_PARTY_NOTICES.md;." --name DiscForge_RU main.py
      - uses: actions/cache@v4
        with:
          path: build/dependencies
          key: windows-tools-ffmpeg902-tsmuxer270-java8u504
      - name: Package tools and Java, self-test, archive
        env:
          PYTHONUTF8: '1'
        run: python tools/package_windows.py --app dist/DiscForge_RU --output release
      - uses: actions/upload-artifact@v4
        with:
          name: DiscForge-RU-Windows-x64
          path: release/
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release 1.4.0'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DiscForge-RU-Windows-x64
          path: release
      - name: Publish official 1.4.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.4.0 release/* --target "$GITHUB_SHA" --title "DiskForge 1.4.0" --notes-file docs/RELEASE_1.4.0.md --latest
